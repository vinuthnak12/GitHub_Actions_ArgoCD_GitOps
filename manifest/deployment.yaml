apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: vinuthnakoganti/my-app:49e54b49be3c8622a2976f9630e972fcdfcadf45
        ports:
        - containerPort: 3000

